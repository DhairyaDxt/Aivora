services:
  - type: web
    name: aivora-rag-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ORCHESTRATION_SHARED_SECRET
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: KB_TOP_K
        value: "4"
      - key: KB_SCORE_THRESHOLD
        value: "0.3"
      - key: MAX_CONVERSATION_TURNS_BEFORE_ESCALATION
        value: "6"
      - key: MAX_MESSAGE_LENGTH_BEFORE_ESCALATION
        value: "500"
    healthCheckPath: /health
    autoDeploy: true