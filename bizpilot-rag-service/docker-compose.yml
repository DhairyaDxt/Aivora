version: '3.8'

services:
  rag-service:
    build: .
    ports:
      - "8001:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ORCHESTRATION_SHARED_SECRET=${ORCHESTRATION_SHARED_SECRET}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - KB_EXTRACTION_MODEL=${KB_EXTRACTION_MODEL:-gemini-2.5-flash}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    restart: unless-stopped
